name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/site.yml"]
  # Wie die anderen Workflows ohne Pfadfilter bei PRs, damit der Check
  # immer entsteht und als Pflicht-Check taugt.
  pull_request:

jobs:
  check:
    name: Links und Ressourcen prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh site/build.sh
      # Prüft wrangler.jsonc und site/dist, ohne zu veröffentlichen.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrangler-Probelauf
        run: npx -y wrangler@4.159.0 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler"
