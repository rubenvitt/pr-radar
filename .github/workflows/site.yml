name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  # Wie die anderen Workflows ohne Pfadfilter bei PRs, damit der Check
  # immer entsteht und als Pflicht-Check taugt.
  pull_request:

jobs:
  check:
    name: Links und Ressourcen prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ohne --strict: offene Platzhalter sind hier nur eine Warnung,
      # den Livegang sperrt der Produktions-Build auf Cloudflare Pages.
      - run: sh site/build.sh
