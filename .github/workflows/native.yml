name: macOS

on:
  push:
    branches: [main]
    paths: ["native/**", "site/public/**", ".github/workflows/native.yml"]
  pull_request:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: Lizenzen und Sicherheitsmeldungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml
          arguments: --locked
      # Dieselbe Erzeugung wie in scripts/bundle.sh, damit das Bündeln nicht erst lokal scheitert.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Drittanbieter-Hinweise erzeugen
        run: cargo about generate --locked --fail about.hbs -o ThirdPartyNotices.html

  check:
    name: Tests und Clippy (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release-Build
        run: cargo build --release --locked
