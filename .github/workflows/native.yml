name: macOS

on:
  push:
    branches: [main]
    paths: ["native/**", "site/public/**", ".github/workflows/native.yml"]
  pull_request:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: Lizenzen und Sicherheitsmeldungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Fertige Binaries mit Prüfsumme; die cargo-deny-Action lädt ihr Programm bei
      # jedem Lauf per Docker-Build ohne Wiederholung und scheiterte daran.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about
      - name: Lizenzen, Sicherheitsmeldungen und Quellen
        run: cargo deny --locked check
      # Dieselbe Erzeugung wie in scripts/bundle.sh, damit das Bündeln nicht erst lokal scheitert.
      - name: Drittanbieter-Hinweise erzeugen
        run: cargo about generate --locked --fail about.hbs -o ThirdPartyNotices.html

  check:
    name: Tests und Clippy (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release-Build
        run: cargo build --release --locked

  # Wie der Release-Workflow, nur ohne Zertifikat (ad hoc signiert) und ohne Beglaubigung: So fällt
  # ein kaputtes Bündeln, Universal-Binary oder Disk-Image schon im PR auf und nicht erst auf main.
  bundle:
    name: App-Bündel und DMG (Universal, Sparkle, ad hoc)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: universal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Bündeln (arm64 + x86_64, mit Sparkle)
        env:
          # Platzhalter (32 Null-Bytes): prüft Download, Einbetten und Signierreihenfolge von Sparkle.
          SPARKLE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: scripts/bundle.sh --universal
      - name: Bündel prüfen
        run: |
          lipo "dist/PR Radar.app/Contents/MacOS/pr-radar" -verify_arch arm64 x86_64
          codesign --display --verbose=2 "dist/PR Radar.app" 2>&1 | grep -E 'flags=.*runtime'
          plutil -lint "dist/PR Radar.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "dist/PR Radar.app/Contents/Info.plist"
          test -x "dist/PR Radar.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          grep -q 'id="sparkle"' "dist/PR Radar.app/Contents/Resources/ThirdPartyNotices.html"
      - name: Disk-Image
        run: scripts/dmg.sh
