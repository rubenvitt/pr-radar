name: Release macOS

# Aufgerufen von release.yml: baut die App als Universal-Binary, signiert sie mit der Developer ID,
# lässt App und Disk-Image von Apple beglaubigen und legt Tag „macos-vX.Y.Z“ samt GitHub-Release mit
# dem DMG und dem Sparkle-Appcast (Auto-Updates) an. Ablauf und Secrets: docs/RELEASING.md
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Bauen, signieren, beglaubigen, veröffentlichen
    runs-on: macos-15
    defaults:
      run:
        working-directory: native
    env:
      VERSION: ${{ inputs.version }}
      TAG: macos-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Alle Tags, damit die Release Notes beim vorigen macOS-Release ansetzen.
          fetch-depth: 0

      - name: Secrets vorhanden?
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Fehlende Secrets: ${missing[*]} (siehe docs/RELEASING.md)"
            exit 1
          fi
          # Sparkle: beide oder keins. Ohne beide gibt es ein Release ohne Auto-Updates.
          if [ -n "$SPARKLE_PUBLIC_KEY" ] && [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Variable SPARKLE_PUBLIC_KEY ist gesetzt, Secret SPARKLE_ED_PRIVATE_KEY fehlt"
            exit 1
          elif [ -z "$SPARKLE_PUBLIC_KEY" ] && [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_ED_PRIVATE_KEY ist gesetzt, Variable SPARKLE_PUBLIC_KEY fehlt"
            exit 1
          elif [ -z "$SPARKLE_PUBLIC_KEY" ]; then
            echo "::warning::Ohne SPARKLE_PUBLIC_KEY/SPARKLE_ED_PRIVATE_KEY: Release ohne Auto-Updates (siehe docs/RELEASING.md)"
          fi

      # Die Version im Repo bleibt stehen; maßgeblich ist der Tag. Erste Zeile „version =“ ist die des Pakets.
      - name: Version in Cargo.toml setzen
        run: perl -pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/ && ($done = 1) unless $done' Cargo.toml && grep -m1 '^version' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Zertifikat in temporären Schlüsselbund
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # Temporären Schlüsselbund vorn in die Suchliste, damit codesign ihn findet.
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::Im P12 steckt kein Zertifikat vom Typ Developer ID Application"
            exit 1
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: App bauen und signieren (Apple Silicon und Intel)
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: scripts/bundle.sh --universal

      - name: App-Store-Connect-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Erst die App: Das angeheftete Ticket steckt dann in der App selbst und gilt auch, wenn
      # jemand sie ohne Netz aus dem Image kopiert. Danach das Image, damit Gatekeeper schon das
      # Öffnen des Downloads ohne Rückfrage erlaubt.
      - name: App beglaubigen (Notarisierung) und Ticket anheften
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/notarize.sh "dist/PR Radar.app"

      - name: Disk-Image bauen, signieren, beglaubigen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          asset="dist/PR-Radar-$VERSION-macOS.dmg"
          scripts/dmg.sh "$asset"
          scripts/notarize.sh "$asset"
          (cd dist && shasum -a 256 "$(basename "$asset")" > "$(basename "$asset").sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Release Notes erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes ab dem vorigen macOS-Release; dieselben stehen im Release und im Update-Fenster.
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          previous=$(git tag --list 'macos-v*' --sort=-v:refname | grep -E '^macos-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          [ -n "$previous" ] && args+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Appcast für Sparkle
        if: vars.SPARKLE_PUBLIC_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sign_update=$(ls target/sparkle-*/bin/sign_update | head -1)
          # Ausgabe: sparkle:edSignature="…" length="…"
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$ASSET")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "dist/PR Radar.app/Contents/Info.plist")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ASSET")"
          page="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          # Markdown-Notes (Sparkle ≥ 2.9); „]]>“ würde den CDATA-Block beenden.
          notes=$(sed 's/]]>/]]]]><![CDATA[>/g' "$RUNNER_TEMP/notes.md")
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>PR Radar</title>
              <link>https://github.com/$GITHUB_REPOSITORY/releases</link>
              <item>
                <title>$VERSION</title>
                <link>$page</link>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$build</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases</sparkle:fullReleaseNotesLink>
                <description sparkle:format="markdown"><![CDATA[$notes]]></description>
                <enclosure url="$url" type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout dist/appcast.xml
          cat dist/appcast.xml
          echo "APPCAST=dist/appcast.xml" >> "$GITHUB_ENV"

      - name: Tag und GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Der Tag entsteht erst hier, auf dem gebauten Commit. --latest: Der Appcast-Feed
          # (releases/latest/download/appcast.xml) und der Download-Link zeigen auf dieses Release.
          assets=("$ASSET" "$ASSET.sha256")
          [ -n "${APPCAST:-}" ] && assets+=("$APPCAST")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PR Radar für macOS $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest "${assets[@]}"

      - name: Aufräumen
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
