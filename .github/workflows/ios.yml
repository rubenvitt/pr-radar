name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "site/public/**", ".github/workflows/ios.yml"]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core-Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: ios/Packages/PRRadarCore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  app-build:
    name: App bauen (iOS-Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Xcode
        run: xcodebuild -version
      - name: Core-Tests (macOS)
        working-directory: ios/Packages/PRRadarCore
        run: swift test
      - name: App bauen
        working-directory: ios
        run: |
          xcodebuild build \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: App- und UI-Tests (iOS-Simulator)
        working-directory: ios
        run: |
          # Neuestes verfügbares iOS mit einem iPhone, statt einen Gerätenamen fest zu verdrahten
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k),
                            key=lambda k: [int(n) for n in re.findall(r"\d+", k.split(".iOS-")[1])], reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $udid"
          xcodebuild test \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination "id=$udid" \
            -only-testing:PRRadarTests \
            -only-testing:PRRadarUITests
