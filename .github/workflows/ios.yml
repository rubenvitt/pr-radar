name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "site/public/**", ".github/workflows/ios.yml", ".github/actions/xcode/**"]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core-Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: ios/Packages/PRRadarCore
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test

  app-build:
    name: App bauen (iOS-Simulator)
    # Gleicher Runner und gleiches Xcode wie release-ios.yml, damit SDK-Probleme schon im PR auffallen.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Xcode
        uses: ./.github/actions/xcode
      - name: Core-Tests (macOS)
        working-directory: ios/Packages/PRRadarCore
        run: swift test
      - name: App bauen
        working-directory: ios
        run: |
          xcodebuild build \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Simulator vorbereiten
        working-directory: ios
        run: |
          # Neuestes verfügbares iOS mit einem iPhone, statt einen Gerätenamen fest zu verdrahten
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k),
                            key=lambda k: [int(n) for n in re.findall(r"\d+", k.split(".iOS-")[1])], reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          # Vorab fertig hochfahren, damit der erste Test nicht in einen halb gebooteten Simulator startet
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild build-for-testing \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination "id=$udid"
      # App-Tests und UI-Tests getrennt: In einem gemeinsamen Lauf lief die App als Test-Host der
      # App-Tests noch, als die UI-Tests starteten. Mit Xcode 27 scheiterte das sporadisch
      # („Failed to get background assertion“ bzw. UI-Test-Runner stürzt beim Start ab), PRR-79.
      - name: App-Tests (iOS-Simulator)
        working-directory: ios
        run: |
          xcodebuild test-without-building \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination "id=$SIM_UDID" \
            -only-testing:PRRadarTests
      - name: UI-Tests (iOS-Simulator)
        working-directory: ios
        run: |
          xcrun simctl terminate "$SIM_UDID" dev.rubeen.prradar || true
          # Ein fehlgeschlagener UI-Test läuft einmal neu; scheitert er wieder, bleibt der Lauf rot.
          xcodebuild test-without-building \
            -project PRRadar.xcodeproj \
            -scheme PRRadar \
            -destination "id=$SIM_UDID" \
            -only-testing:PRRadarUITests \
            -retry-tests-on-failure \
            -test-iterations 2
