<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7fff"/>
      <stop offset="1" stop-color="#4632d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
    <filter id="blipglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- Radar-Ringe -->
    <g fill="none" stroke="#ffffff">
      <circle cx="512" cy="512" r="300" stroke-width="14" opacity="0.22"/>
      <circle cx="512" cy="512" r="205" stroke-width="14" opacity="0.32"/>
      <circle cx="512" cy="512" r="110" stroke-width="16" opacity="0.5"/>
      <line x1="212" y1="512" x2="812" y2="512" stroke-width="6" opacity="0.14"/>
      <line x1="512" y1="212" x2="512" y2="812" stroke-width="6" opacity="0.14"/>
    </g>
    <!-- Sweep -->
    <path d="M512 512 L512 212 A300 300 0 0 1 724 300 Z" fill="url(#sweep)"/>
    <line x1="512" y1="512" x2="724" y2="300" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- Blips: grün, gelb, rot – die Pipeline-Zustände -->
    <g>
      <circle cx="652" cy="402" r="34" fill="#34d399" filter="url(#blipglow)" opacity="0.9"/>
      <circle cx="652" cy="402" r="24" fill="#34d399" stroke="#ffffff" stroke-width="7"/>
      <circle cx="372" cy="356" r="30" fill="#fbbf24" filter="url(#blipglow)" opacity="0.9"/>
      <circle cx="372" cy="356" r="20" fill="#fbbf24" stroke="#ffffff" stroke-width="6"/>
      <circle cx="418" cy="684" r="30" fill="#fb7185" filter="url(#blipglow)" opacity="0.9"/>
      <circle cx="418" cy="684" r="20" fill="#fb7185" stroke="#ffffff" stroke-width="6"/>
    </g>
    <circle cx="512" cy="512" r="26" fill="#ffffff"/>
    <!-- feine Kante oben für Tiefe -->
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  </g>
</svg>
