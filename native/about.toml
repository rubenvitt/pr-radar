# cargo-about: erzeugt die Drittanbieter-Hinweise (about.hbs → ThirdPartyNotices.html).
# Aufruf in scripts/bundle.sh. Lizenzliste wie in deny.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Nur was in der App landet.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
