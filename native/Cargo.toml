[package]
name = "pr-radar"
version = "0.1.0"
edition = "2024"
description = "Native Desktop-App für Pull Requests, Pipelines, Auto-Merge, Merges und Releases über mehrere GitHub-Repos."
publish = false
license = "Apache-2.0"

[dependencies]
gpui-kit = "=0.7.0"
# Registriert den HTTP-Client für GPUI (Avatare per img(url)) und GraphQL.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
