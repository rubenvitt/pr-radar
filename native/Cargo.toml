[package]
name = "pr-radar"
version = "0.1.0"
edition = "2024"
description = "Native Desktop-App für Pull Requests, Pipelines, Auto-Merge, Merges und Releases über mehrere GitHub-Repos."
publish = false
license = "FSL-1.1-ALv2"

[dependencies]
gpui-kit = "=0.7.0"
# Registriert den HTTP-Client für GPUI (Avatare per img(url)) und GraphQL.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
log = "0.4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Menüleisten-Symbol, Dock-Badge und „Beim Anmelden starten“ (GPUI kennt beides nicht).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }
